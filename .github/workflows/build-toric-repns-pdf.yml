name: Build toric representations PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-toric-repns-pdf.yml'
      - 'toric-repns/toric-repns.tex'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Compile toric representations Draft 4
        working-directory: toric-repns
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error toric-repns.tex
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f toric-repns/toric-repns.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Compile toric representations Draft 4 PDF"
            git push origin HEAD:main
          fi
