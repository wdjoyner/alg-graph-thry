name: Build Grosswald-Schnitzer and RH companion PDFs
concurrency:
  group: grosswald-pdf-main
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-prime-perturbations-pdfs.yml'
      - 'grosswald-schnitzer-graph/prime_perturbations_revised.tex'
      - 'grosswald-schnitzer-graph/grosswald_schnitzer_spectral_invariance_2026.tex'
      - 'zeta-operators-graph/rh_2026_operator_implications.tex'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic
      - name: Compile two modern papers
        working-directory: grosswald-schnitzer-graph
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error prime_perturbations_revised.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error grosswald_schnitzer_spectral_invariance_2026.tex
      - name: Compile RH companion note
        working-directory: zeta-operators-graph
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error rh_2026_operator_implications.tex
      - name: Upload PDFs as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zeta-operator-modern-pdfs
          path: |
            grosswald-schnitzer-graph/prime_perturbations_revised.pdf
            grosswald-schnitzer-graph/grosswald_schnitzer_spectral_invariance_2026.pdf
            zeta-operators-graph/rh_2026_operator_implications.pdf
      - name: Commit compiled PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/grosswald-pdfs /tmp/zeta-pdfs
          cp grosswald-schnitzer-graph/*.pdf /tmp/grosswald-pdfs/
          cp zeta-operators-graph/rh_2026_operator_implications.pdf /tmp/zeta-pdfs/
          git fetch origin main
          # Never publish a PDF built from stale TeX.
          for tex in grosswald-schnitzer-graph/prime_perturbations_revised.tex grosswald-schnitzer-graph/grosswald_schnitzer_spectral_invariance_2026.tex zeta-operators-graph/rh_2026_operator_implications.tex; do
            if [ "$(git rev-parse HEAD:"$tex")" != "$(git rev-parse origin/main:"$tex")" ]; then
              echo "Source changed while building $tex; a newer workflow will rebuild."
              exit 0
            fi
          done
          # Incorporate remote changes before staging freshly built binaries.
          git reset --hard origin/main
          cp /tmp/grosswald-pdfs/*.pdf grosswald-schnitzer-graph/
          cp /tmp/zeta-pdfs/*.pdf zeta-operators-graph/
          git add -f grosswald-schnitzer-graph/prime_perturbations_revised.pdf grosswald-schnitzer-graph/grosswald_schnitzer_spectral_invariance_2026.pdf zeta-operators-graph/rh_2026_operator_implications.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build modern zeta operator PDFs"
            git push origin HEAD:main
          fi
