name: Build zeta operators PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-zeta-operators-pdf.yml'
      - 'zeta-operators-graph/zeta_operators_2026.tex'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-fonts-extra texlive-plain-generic
      - name: Compile manuscript
        working-directory: zeta-operators-graph
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error zeta_operators_2026.tex
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f zeta-operators-graph/zeta_operators_2026.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build zeta_operators_2026.pdf"
            git push origin HEAD:main
          fi
